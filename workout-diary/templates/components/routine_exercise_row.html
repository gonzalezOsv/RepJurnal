<template id="routine-exercise-row-template">
    <div class="routine-exercise-row bg-gray-50 dark:bg-gray-700/50 rounded-xl p-3 border-2 border-gray-200 dark:border-gray-600 transition-all" data-exercise-index="">
        <div class="flex items-start gap-3">
            <div class="flex-shrink-0 pt-1">
                <input type="checkbox" class="routine-exercise-checkbox w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-green-500" />
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex-1 min-w-0">
                        <h4 class="routine-exercise-name text-base font-bold text-gray-800 dark:text-gray-100 truncate"></h4>
                        <p class="routine-body-part text-xs text-gray-600 dark:text-gray-400"></p>
                    </div>
                    <button class="routine-edit-btn p-1.5 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-all flex-shrink-0" title="Edit">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                    </button>
                </div>

                <div class="routine-display-mode">
                    <div class="routine-display-cardio space-y-1 text-xs hidden">
                        <p class="duration-row hidden text-gray-700 dark:text-gray-300">
                            <span class="font-semibold">Duration:</span>
                            <span class="routine-display-duration ml-1 font-bold text-gray-800 dark:text-gray-200"></span>
                            <span class="text-gray-500 dark:text-gray-400">min</span>
                        </p>
                        <p class="intensity-row hidden text-gray-700 dark:text-gray-300">
                            <span class="font-semibold">Intensity:</span>
                            <span class="routine-display-intensity ml-1 font-bold text-gray-800 dark:text-gray-200"></span>
                        </p>
                    </div>

                    <div class="routine-display-strength grid grid-cols-3 gap-2 text-xs hidden">
                        <div>
                            <span class="text-gray-600 dark:text-gray-400 font-semibold">Sets:</span>
                            <span class="routine-display-sets ml-1 font-bold text-gray-800 dark:text-gray-200">--</span>
                        </div>
                        <div>
                            <span class="text-gray-600 dark:text-gray-400 font-semibold">Reps:</span>
                            <span class="routine-display-reps ml-1 font-bold text-gray-800 dark:text-gray-200">--</span>
                        </div>
                        <div>
                            <span class="text-gray-600 dark:text-gray-400 font-semibold">Weight:</span>
                            <span class="routine-display-weight ml-1 font-bold text-gray-800 dark:text-gray-200">--</span>
                        </div>
                    </div>
                </div>

                <div class="routine-fields-container hidden mt-2 space-y-2">
                    <div class="routine-cardio-fields hidden">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Duration (min)</label>
                                <input type="number" step="0.5" class="routine-duration w-full px-2 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-gray-900 dark:text-gray-100" value="" min="0">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Intensity</label>
                                <select class="routine-intensity w-full px-2 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-gray-900 dark:text-gray-100">
                                    <option value="">Select</option>
                                    <option value="Low">Low</option>
                                    <option value="Moderate">Moderate</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="routine-strength-fields hidden">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Sets</label>
                                <input type="number" class="routine-sets w-full px-2 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-center text-gray-900 dark:text-gray-100" value="" min="1" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Reps</label>
                                <input type="number" class="routine-reps w-full px-2 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-center text-gray-900 dark:text-gray-100" value="" min="1" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Weight</label>
                                <div class="flex gap-1">
                                    <input type="number" step="0.5" class="routine-weight flex-1 px-1 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-center text-gray-900 dark:text-gray-100" value="" min="0" placeholder="0">
                                    <select class="routine-unit px-1 py-1.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs text-gray-900 dark:text-gray-100">
                                        <option value="lb">lbs</option>
                                        <option value="kg">kg</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="routine-update-display-btn w-full px-3 py-1.5 bg-blue-600 dark:bg-blue-500 hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-xs font-bold rounded-lg transition-all mt-1">
                            Update Display
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
