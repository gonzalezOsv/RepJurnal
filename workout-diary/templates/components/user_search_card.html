<!-- User Search Result Card Template Component -->
<!-- This template is used to render user search results dynamically -->
<!-- Usage: Clone this template in JavaScript and populate with data -->

<template id="user-search-card-template">
    <div class="user-card bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-600 transition-all duration-200 shadow-sm hover:shadow-md">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <!-- Avatar -->
                <div class="user-avatar w-12 h-12 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold text-base flex-shrink-0 shadow-md">
                    <!-- Initials will be inserted here -->
                </div>
                
                <!-- User info -->
                <div class="min-w-0 flex-1">
                    <h4 class="user-name font-bold text-slate-900 dark:text-white text-base truncate"></h4>
                    <p class="user-username text-sm text-slate-500 dark:text-slate-400 truncate"></p>
                </div>
            </div>
            
            <!-- Action button (Add Friend / Pending / Already Friends) -->
            <div class="action-button-container ml-3">
                <!-- Will be populated by JavaScript based on friendship status -->
            </div>
        </div>
    </div>
</template>
