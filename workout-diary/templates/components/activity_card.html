<!-- Activity Feed Card Template Component -->
<!-- This template is used to render friend activity/workout cards dynamically -->
<!-- Usage: Clone this template in JavaScript and populate with data -->

<template id="activity-card-template">
    <div class="activity-card bg-white dark:bg-gray-700 rounded-xl p-5 border-2 border-gray-200 dark:border-gray-600 hover:border-indigo-300 dark:hover:border-indigo-600 transition-all shadow-sm hover:shadow-md">
        <div class="flex items-start gap-3">
            <!-- Avatar -->
            <div class="activity-avatar w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-blue-500 flex items-center justify-center text-white font-bold flex-shrink-0">
                <!-- Initials will be inserted here -->
            </div>
            
            <div class="flex-1 min-w-0">
                <!-- Activity header -->
                <p class="text-gray-900 dark:text-white font-semibold">
                    <span class="activity-user-name font-bold"></span>
                    <span class="activity-action">completed a workout</span>
                </p>
                <p class="activity-date text-sm text-gray-500 dark:text-gray-400 mb-3"></p>
                
                <!-- Activity stats grid -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
                    <!-- Exercises count -->
                    <div class="bg-gradient-to-br from-indigo-50 to-blue-50 dark:from-indigo-900/20 dark:to-blue-900/20 rounded-lg p-2 text-center">
                        <p class="activity-exercises-count text-lg font-bold text-indigo-600 dark:text-indigo-400"></p>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Exercises</p>
                    </div>
                    
                    <!-- Total sets -->
                    <div class="bg-gradient-to-br from-purple-50 to-pink-50 dark:from-purple-900/20 dark:to-pink-900/20 rounded-lg p-2 text-center">
                        <p class="activity-total-sets text-lg font-bold text-purple-600 dark:text-purple-400"></p>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Sets</p>
                    </div>
                    
                    <!-- Body parts count -->
                    <div class="bg-gradient-to-br from-green-50 to-teal-50 dark:from-green-900/20 dark:to-teal-900/20 rounded-lg p-2 text-center">
                        <p class="activity-body-parts-count text-lg font-bold text-green-600 dark:text-green-400"></p>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Body Parts</p>
                    </div>
                    
                    <!-- Total volume -->
                    <div class="bg-gradient-to-br from-orange-50 to-red-50 dark:from-orange-900/20 dark:to-red-900/20 rounded-lg p-2 text-center">
                        <p class="activity-total-volume text-lg font-bold text-orange-600 dark:text-orange-400"></p>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Volume (lbs)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
