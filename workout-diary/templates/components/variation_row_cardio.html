<template id="variation-row-cardio-template">
    <div class="variation-row flex items-center justify-between py-3 px-3 sm:px-4 bg-white dark:bg-gray-700 rounded-lg border border-gray-200 dark:border-gray-600 hover:border-blue-300 dark:hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-gray-600 transition-all" data-variation-data="">
        <div class="variation-content flex items-center gap-2 sm:gap-3 flex-wrap flex-1">
            <!-- Duration -->
            <div class="duration-container flex items-center gap-1.5 hidden">
                <span class="text-xs text-gray-600 dark:text-gray-300 font-semibold">Duration:</span>
                <span class="duration-value text-sm sm:text-base font-bold text-blue-700 dark:text-blue-300"></span>
            </div>
            <!-- Distance -->
            <div class="distance-container flex items-center gap-1.5 hidden">
                <span class="text-xs text-gray-600 dark:text-gray-300 font-semibold">Distance:</span>
                <span class="distance-value text-sm sm:text-base font-bold text-green-700 dark:text-green-300"></span>
            </div>
            <!-- Intensity -->
            <span class="intensity-value text-sm sm:text-base font-bold text-purple-700 dark:text-purple-300 hidden"></span>
            <!-- Calories -->
            <div class="calories-container flex items-center gap-1.5 hidden">
                <span class="text-xs text-gray-600 dark:text-gray-300 font-semibold">Calories:</span>
                <span class="calories-value text-sm sm:text-base font-bold text-orange-700 dark:text-orange-300"></span>
            </div>
            <!-- Count -->
            <span class="count-value text-xs text-gray-600 dark:text-gray-400 font-semibold hidden"></span>
        </div>
        <div class="variation-actions flex items-center gap-1 sm:gap-2">
            <button 
                class="edit-variation-btn flex-shrink-0 p-2 sm:p-2.5 hover:bg-blue-100 dark:hover:bg-blue-900/40 text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 rounded-lg transition-all border border-blue-200 dark:border-blue-700 hover:border-blue-300 dark:hover:border-blue-600"
                data-ids=""
                title="Edit this set">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>
            <button 
                class="delete-variation-btn flex-shrink-0 p-2 sm:p-2.5 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 rounded-lg transition-all border border-red-200 dark:border-red-700 hover:border-red-300 dark:hover:border-red-600"
                data-ids=""
                title="Delete this set">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>
</template>
